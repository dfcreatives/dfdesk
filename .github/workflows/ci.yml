name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        env:
          DATABASE_URL: postgresql://desk:desk@localhost:5432/desk?schema=desk
          DF_INTEGRATION_SECRET: test-secret-that-is-at-least-32-characters-long
      - run: npm test
        env:
          DATABASE_URL: postgresql://desk:desk@localhost:5432/desk?schema=desk
          DF_INTEGRATION_SECRET: test-secret-that-is-at-least-32-characters-long
      - run: npm run build
        env:
          DATABASE_URL: postgresql://desk:desk@localhost:5432/desk?schema=desk
          DF_INTEGRATION_SECRET: test-secret-that-is-at-least-32-characters-long
